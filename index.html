<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="robots" content="noindex, nofollow">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Mumin-demo">
  <meta name="theme-color" content="#35597f">
  <link rel="apple-touch-icon" href="icon.png">
  <title>Höst i Mumindalen demo</title>
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #1d2f45; overscroll-behavior: none; }
    body { position: fixed; inset: 0; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
    #unity-canvas { position: absolute; left: 0; top: 0; width: 100vw; height: 100vh; height: 100dvh; display: block; touch-action: none; outline: none; background: #1d2f45; }
    #load { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
            font-family: -apple-system, system-ui, sans-serif; color: #fff6e6; text-align: center; padding: 24px; box-sizing: border-box; }
    #load img { width: 112px; height: 112px; }
    #load h1 { margin: 0; font-size: 22px; font-weight: 600; }
    #bar { width: min(280px, 70vw); height: 10px; border-radius: 5px; background: rgba(255,246,230,0.2); overflow: hidden; }
    #fill { width: 0; height: 100%; background: #f39a3d; transition: width 0.2s; }
    #msg { font-size: 15px; opacity: 0.85; max-width: 420px; line-height: 1.4; }
  </style>
</head>
<body>
  <canvas id="unity-canvas" tabindex="-1"></canvas>
  <div id="load">
    <img src="icon.png" alt="">
    <h1>Höst i Mumindalen</h1>
    <div id="bar"><div id="fill"></div></div>
    <div id="msg">Laddar demot&hellip; första gången tar det en stund, sedan går det fort.</div>
  </div>
  <script>
    // no page scrolling, pinch zoom or double-tap zoom: every touch belongs to the game
    ['touchmove', 'gesturestart', 'gesturechange', 'dblclick'].forEach(function (e) {
      document.addEventListener(e, function (ev) { ev.preventDefault(); }, { passive: false });
    });
    // ask the browser to keep this page's storage (the save) instead of clearing it when space runs low or the page is not visited for a while
    if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(function () { });
    var canvas = document.querySelector('#unity-canvas');
    var buildUrl = 'Build';
    var config = {
      dataUrl: buildUrl + '/WebDemo.data.unityweb',
      frameworkUrl: buildUrl + '/WebDemo.framework.js.unityweb',
      codeUrl: buildUrl + '/WebDemo.wasm.unityweb',
      streamingAssetsUrl: 'StreamingAssets',
      // the save is written to the browser's storage as soon as it changes
      autoSyncPersistentDataPath: true,
      companyName: "Hemmabygge",
      productName: "Höst i Mumindalen demo",
      productVersion: "0.1.0",
      // an iPhone screen has 3 pixels per point; drawing all of them is too heavy, 2 still looks sharp
      devicePixelRatio: Math.min(window.devicePixelRatio || 1, 2),
      showBanner: function (msg, type) { if (type === 'error') document.querySelector('#msg').textContent = 'Fel: ' + msg; console.log(msg); }
    };
    var script = document.createElement('script');
    script.src = buildUrl + '/WebDemo.loader.js';
    script.onload = function () {
      createUnityInstance(canvas, config, function (p) {
        document.querySelector('#fill').style.width = Math.round(p * 100) + '%';
      }).then(function (unity) {
        document.querySelector('#load').style.display = 'none';
        // save when the page is hidden (another app, tab closed, phone locked): the game writes its save then
        var hidden = function () { try { unity.SendMessage('Mumindalen', 'WebHidden'); } catch (e) { } };
        document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'hidden') hidden(); });
        window.addEventListener('pagehide', hidden);
      }).catch(function (m) {
        document.querySelector('#msg').textContent = 'Demot kunde inte starta: ' + m;
      });
    };
    document.body.appendChild(script);
  </script>
</body>
</html>
